<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Важливе опитування про бджіл</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fff8d6 0%, #ffe066 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(212, 140, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 4px solid #ffcc00;
            position: relative;
            z-index: 1;
        }

        .bee-icon {
            font-size: 80px;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
        }

        h1 {
            color: #332200;
            font-size: 28px;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 50px;
        }

        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        #yesBtn {
            background-color: #ffb703;
            color: #2b1d00;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
        }

        #yesBtn:hover {
            background-color: #fb8500;
            transform: scale(1.08);
        }

        #noBtn {
            background-color: #e0e0e0;
            color: #555555;
            position: relative;
        }

        .success-message {
            display: none;
            margin-top: 20px;
        }

        .success-message h2 {
            color: #d97706;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .success-message p {
            color: #554422;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="bee-icon" id="beeIcon">🐝</div>
    <h1 id="questionText">Чи ти поважаєш бджіл?</h1>

    <div class="buttons" id="btnGroup">
        <button id="yesBtn">Так, звісно!</button>
        <button id="noBtn">Ні</button>
    </div>

    <div class="success-message" id="successMsg">
        <h2>Правильний вибір! 🍯</h2>
        <p>Бджоли це схвалюють. Дякуємо за повагу до працьовитих смугастиків!</p>
    </div>
</div>

<script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const btnGroup = document.getElementById('btnGroup');
    const questionText = document.getElementById('questionText');
    const successMsg = document.getElementById('successMsg');
    const beeIcon = document.getElementById('beeIcon');

    // Дія при натисканні на "Так"
    yesBtn.addEventListener('click', () => {
        btnGroup.style.display = 'none';
        questionText.style.display = 'none';
        successMsg.style.display = 'block';
        beeIcon.textContent = '🐝💛🍯';
    });

    // Функція переміщення кнопки "Ні"
    function moveNoButton() {
        // Переводимо кнопку в фіксоване позиціонування, щоб вона літала по всьому екрану
        noBtn.style.position = 'fixed';

        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;

        // Вираховуємо безпечні межі екрану
        const maxX = window.innerWidth - btnWidth - 20;
        const maxY = window.innerHeight - btnHeight - 20;

        const randomX = Math.max(20, Math.floor(Math.random() * maxX));
        const randomY = Math.max(20, Math.floor(Math.random() * maxY));

        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
    }

    // Тікає при наведенні мишки (для ПК)
    noBtn.addEventListener('mouseover', moveNoButton);

    // Тікає при спробі натиснути на сенсорному екрані (для смартфонів)
    noBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveNoButton();
    });
</script>

</body>
</html>
